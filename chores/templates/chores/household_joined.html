<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Joined household</title>
</head>
<body>
  {% if is_returning %}
  <h1>Welcome back, {{ roommate.name }}!</h1>
  {% else %}
  <h1>Welcome, {{ roommate.name }}!</h1>
  {% endif %}
  <p>You have joined household <strong>{{ household.code }}</strong>.</p>
  <p><a href="{% url 'my_chores' %}">Go to my chores</a></p>
</body>
</html>
