{% extends "chores/base.html" %}

{% block title %}Joined household{% endblock %}

{% block content %}
  {% if is_returning %}
  <h1>Welcome back, {{ roommate.name }}!</h1>
  {% else %}
  <h1>Welcome, {{ roommate.name }}!</h1>
  {% endif %}
  <p>You have joined household <strong>{{ household.code }}</strong>.</p>
  <p class="footer-link"><a href="{% url 'my_chores' %}">Go to my chores</a></p>
{% endblock %}
