<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Household Chores{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f2ee;
      --card: #ffffff;
      --ink: #2b2a28;
      --muted: #7a756c;
      --border: #e7e2d9;
      --accent: #3a6b63;
      --accent-dark: #2c524c;
      --overdue: #b3452e;
      --overdue-bg: #fbeae5;
      --chip-bg: #eef2ea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 2.5rem 1rem;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    .page {
      max-width: 32rem;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.75rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .badge {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--muted);
      background: var(--chip-bg);
      border-radius: 999px;
      padding: 0.3rem 0.8rem;
      margin-bottom: 1rem;
    }

    .badge strong { color: var(--ink); }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem;
    }

    h2 {
      font-size: 1.05rem;
      color: var(--muted);
      margin: 1.75rem 0 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    p { margin: 0.5rem 0; }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin: 1rem 0 0.3rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      font-size: 1rem;
      background: #fff;
      color: var(--ink);
    }

    input[type="text"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button, .btn {
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.55rem 1.1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
    }

    button:hover, .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

    form.inline { display: inline; margin: 0; }

    .btn-secondary {
      background: transparent;
      color: var(--accent);
    }

    .btn-secondary:hover { background: var(--chip-bg); color: var(--accent-dark); }

    .actions { margin-top: 1.25rem; }

    .actions form { margin-bottom: 0.6rem; }

    ul.chore-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    ul.chore-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      margin-bottom: 0.6rem;
    }

    ul.chore-list li.overdue {
      background: var(--overdue-bg);
      border-color: #eecbc0;
    }

    .chore-name { font-weight: 600; }

    .chore-due {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: normal;
    }

    .overdue .chore-due, .overdue-tag {
      color: var(--overdue);
      font-weight: 600;
    }

    .empty-state {
      color: var(--muted);
      padding: 1rem 0;
    }

    .code-chip {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      background: var(--chip-bg);
      border-radius: 0.6rem;
      padding: 0.6rem 1rem;
      text-align: center;
      margin: 1rem 0;
    }

    .error {
      color: var(--overdue);
      background: var(--overdue-bg);
      border-radius: 0.5rem;
      padding: 0.6rem 0.8rem;
      font-size: 0.9rem;
    }

    .footer-link { margin-top: 1.5rem; font-size: 0.9rem; }
    .footer-link a { color: var(--accent); }

    nav.links a {
      display: block;
      margin: 0.4rem 0;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    nav.links a:hover { text-decoration: underline; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="page">
    <div class="card">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
