{% extends "chores/base.html" %}

{% block title %}Join household{% endblock %}

{% block content %}
  <h1>Join a household</h1>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="code">Household code</label>
    <input id="code" name="code" type="text" required autofocus>
    <label for="name">Your name</label>
    <input id="name" name="name" type="text" required>
    <div class="actions">
      <button type="submit">Join household</button>
    </div>
  </form>
{% endblock %}
