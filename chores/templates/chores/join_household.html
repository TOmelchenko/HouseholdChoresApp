<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Join household</title>
</head>
<body>
  <h1>Join a household</h1>
  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="code">Household code</label>
    <input id="code" name="code" type="text" required autofocus>
    <label for="name">Your name</label>
    <input id="name" name="name" type="text" required>
    <button type="submit">Join household</button>
  </form>
</body>
</html>
